    <!-- GitHub Pages Subpath SPA Router Normalizer -->
    <script>
      (function() {
        var base = '/rambobdix/';
        var path = window.location.pathname;
        if (path.startsWith(base) && path.length > base.length && !window.location.hash) {
          var sub = path.slice(base.length).replace(/^\/+/, '');
          if (sub && !sub.includes('.')) {
            window.location.replace(base + '#/' + sub + window.location.search);
          }
        }
      })();
    </script>
